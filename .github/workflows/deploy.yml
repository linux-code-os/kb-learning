# Деплой сайта KB Learning на GitHub Pages (статический экспорт)
#
# При пуше в main автоматически: собирает статический сайт → публикует на Pages.
# URL: https://linux-code-dev.github.io/KB_Learning/
#
# Что работает на GitHub Pages (статика):
#   ✓ Все секции сайта (hero, simulator, converter, cross-rates, FAQ, и т.д.)
#   ✓ GitHub stats (клиентский fetch к api.github.com, CORS поддерживается)
#   ✓ localStorage persistence симулятора
#   ✓ i18n RU/EN, тема, sparklines
# Что НЕ работает (требует сервера):
#   ✗ /api/subscribe — заменён на mailto fallback (открывает почтовый клиент)
#   ✗ /api/og — динамическая OG-картинка (метаданные используют статичный /og.svg)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          # Базовый путь для project pages: /KB_Learning
          # Для user/org pages (username.github.io) — закомментируйте.
          NEXT_PUBLIC_BASE_PATH: /KB_Learning
        run: bun run build:pages

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
